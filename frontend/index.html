<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radians — SPHEREx sky blink</title>
  <meta name="description" content="Watch NASA SPHEREx infrared images of any patch of sky change over time.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffb347'/%3E%3Cpath d='M16 2v6M16 24v6M2 16h6M24 16h6' stroke='%23ffb347' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5"/><path d="M16 2v6M16 24v6M2 16h6M24 16h6"/></svg>
    <span>Radians</span>
  </a>
  <p class="tagline" data-i18n="tagline"></p>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="tr">TR</button>
  </div>
</header>

<form id="search" class="search" autocomplete="off">
  <label class="grow">
    <span class="lbl" data-i18n="target"></span>
    <input id="q" name="q" data-i18n-ph="targetPh" required>
  </label>
  <label>
    <span class="lbl" data-i18n="fov"></span>
    <select id="fov">
      <option value="120">2′</option>
      <option value="240" selected>4′</option>
      <option value="360">6′</option>
      <option value="600">10′</option>
      <option value="1200">20′</option>
    </select>
  </label>
  <label>
    <span class="lbl" data-i18n="frames"></span>
    <select id="mode">
      <option value="epoch" selected data-i18n="modeEpoch"></option>
      <option value="epoch_detector" data-i18n="modeEpochDet"></option>
      <option value="exposure" data-i18n="modeExposure"></option>
    </select>
  </label>
  <button type="submit" id="go" data-i18n="blink"></button>
</form>
<div class="dets">
  <span class="lbl" data-i18n="detectors"></span>
  <div class="detchips" id="detchips" role="group"></div>
  <select id="preset" aria-label="Detector preset">
    <option value="1,2,3,4,5,6" data-i18n="presetAll"></option>
    <option value="1,2,3" data-i18n="presetShort"></option>
    <option value="4,5,6" data-i18n="presetLong"></option>
    <option value="6" data-i18n="presetD6"></option>
    <option value="custom" data-i18n="presetCustom" hidden></option>
  </select>
</div>
<div class="examples" id="examples">
  <span class="lbl" data-i18n="tryLbl"></span>
  <button data-q="Barnard's Star">Barnard's Star</button>
  <button data-q="eps Indi B">ε Indi B</button>
  <button data-q="WISE J085510.83-071442.5" data-det="6">WISE 0855 (D6)</button>
  <button data-q="RW Aur">RW Aurigae</button>
  <button data-q="R Dra">R Draconis</button>
</div>

<main class="layout">
  <section class="viewer" aria-label="Sky viewer">
    <div class="viewbar">
      <label><span class="lbl" data-i18n="view"></span>
        <select id="view">
          <option value="images" data-i18n="viewImages"></option>
          <option value="diff_median" data-i18n="viewDiffMedian"></option>
          <option value="diff_prev" data-i18n="viewDiffPrev"></option>
          <option value="diff_first" data-i18n="viewDiffFirst"></option>
          <option value="stack" data-i18n="viewStack"></option>
        </select>
      </label>
      <p class="muted small" id="viewHelp"></p>
    </div>
    <div class="stage" id="stage">
      <canvas id="sky" width="1" height="1"></canvas>
      <canvas id="overlay" width="1" height="1"></canvas>
      <div class="hud hud-tl" id="hudDate"></div>
      <div class="hud hud-tr" id="hudIdx"></div>
      <div class="hud hud-bl compass" aria-hidden="true"><span class="n">N</span><span class="e">E</span></div>
      <div class="hud hud-br" id="hudScale"></div>
      <div class="empty" id="empty">
        <p data-i18n="emptyTitle"></p>
        <p class="muted" data-i18n="emptyBody"></p>
      </div>
      <div class="loading" id="loading" hidden>
        <div class="spinner"></div>
        <p id="loadingMsg"></p>
        <progress id="loadingBar" max="1" value="0" hidden></progress>
        <p class="muted" id="loadingSub"></p>
      </div>
    </div>

    <div class="controls" id="controls">
      <button id="prev" aria-label="Previous frame">⏮</button>
      <button id="play" aria-label="Play">▶</button>
      <button id="next" aria-label="Next frame">⏭</button>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Frame">
      <label class="speed">
        <span id="fpsVal">2</span> fps
        <input id="fps" type="range" min="0.5" max="10" step="0.5" value="2" aria-label="Speed">
      </label>
    </div>
    <ol class="timeline" id="timeline"></ol>

    <section class="analysis" id="analysis" hidden>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="spectrum" aria-selected="true" data-i18n="tabSpectrum"></button>
        <button type="button" role="tab" data-tab="lightcurve" aria-selected="false" data-i18n="tabLight"></button>
        <button type="button" role="tab" data-tab="table" aria-selected="false" data-i18n="tabTable"></button>
      </div>
      <div class="anabar">
        <span id="photSource" class="small"></span>
        <label class="small"><span data-i18n="photMode"></span>
          <select id="photMode">
            <option value="aperture" data-i18n="photAperture"></option>
            <option value="wings" data-i18n="photWings"></option>
          </select>
        </label>
        <label class="small check"><input id="photFlagged" type="checkbox" checked> <span data-i18n="photShowFlagged"></span></label>
        <button type="button" id="photCsv" class="small" data-i18n="csv"></button>
      </div>
      <div id="chart"></div>
      <p class="muted small" id="chartNote"></p>
    </section>

    <details class="context" id="ctx">
      <summary data-i18n="context"></summary>
      <div class="ctxbar">
        <select id="ctxSurvey" aria-label="Survey">
          <option value="https://irsa.ipac.caltech.edu/data/hips/CDS/2MASS/Color">2MASS (J, H, K)</option>
          <option value="https://irsa.ipac.caltech.edu/data/hips/CDS/AllWISE/RGB-W4-W2-W1">AllWISE (W1, W2, W4)</option>
          <option value="https://irsa.ipac.caltech.edu/data/hips/SPHEREx/spherex_allsky_cube">SPHEREx DR1</option>
          <option value="https://irsa.ipac.caltech.edu/data/hips/CDS/DSS2/color">DSS2 (optical)</option>
        </select>
        <label class="small check"><input id="ctxGaia" type="checkbox" checked> Gaia DR3</label>
        <label class="small check"><input id="ctxCatwise" type="checkbox"> CatWISE2020</label>
      </div>
      <div id="aladin"></div>
      <p class="muted small" data-i18n="contextHelp"></p>
    </details>
  </section>

  <aside class="panel">
    <section>
      <h2><span data-i18n="candidates"></span> <span class="count" id="candCount"></span></h2>
      <label class="row check"><input id="showCands" type="checkbox" checked> <span data-i18n="showCands"></span></label>
      <ul class="cands" id="cands"></ul>
      <p class="muted small" data-i18n="candHelp"></p>
    </section>

    <section>
      <h2 data-i18n="overlays"></h2>
      <label class="row check"><input id="ovGaia" type="checkbox" checked> <span class="ovkey gaia"></span><span data-i18n="ovGaia"></span></label>
      <label class="row check"><input id="ovSso" type="checkbox" checked> <span class="ovkey sso"></span><span data-i18n="ovSso"></span></label>
      <p class="muted small" id="ovStatus"></p>
    </section>

    <section>
      <h2 data-i18n="thisFrame"></h2>
      <dl id="frameInfo" class="kv"><dt>—</dt><dd></dd></dl>
      <div id="flagSummary" class="flagsum"></div>
      <details id="expDetails"><summary id="expSummary"></summary><ol id="expList" class="explist"></ol></details>
    </section>

    <section>
      <h2 data-i18n="display"></h2>
      <label class="row"><span data-i18n="stretch"></span>
        <select id="stretch">
          <option value="asinh" selected>asinh</option>
          <option value="linear">linear</option>
          <option value="log">log</option>
          <option value="sqrt">sqrt</option>
        </select>
      </label>
      <label class="row"><span data-i18n="colours"></span>
        <select id="cmap">
          <option value="gray" selected data-i18n="cmGray"></option>
          <option value="invert" data-i18n="cmInvert"></option>
          <option value="heat" data-i18n="cmHeat"></option>
        </select>
      </label>
      <label class="row"><span data-i18n="black"></span><input id="lo" type="range" min="0" max="60" step="0.5" value="5"></label>
      <label class="row"><span data-i18n="white"></span><input id="hi" type="range" min="90" max="100" step="0.05" value="99.7"></label>
      <label class="row check"><input id="cross" type="checkbox" checked> <span data-i18n="marker"></span></label>
      <label class="row check"><input id="flagView" type="checkbox"> <span data-i18n="showFlagged"></span></label>
    </section>

    <section>
      <h2 data-i18n="cursor"></h2>
      <dl id="cursor" class="kv"><dt>RA, Dec</dt><dd>—</dd></dl>
    </section>

    <section>
      <h2 data-i18n="neossat"></h2>
      <p class="muted small" data-i18n="neossatHelp"></p>
      <ul id="neossat" class="neolist"></ul>
    </section>

    <section>
      <h2 data-i18n="share"></h2>
      <div class="share">
        <input id="link" readonly aria-label="Link">
        <button id="copy" type="button" data-i18n="copy"></button>
      </div>
      <p class="muted small" data-i18n="shareHelp"></p>
    </section>
  </aside>
</main>

<footer class="foot">
  Data: NASA SPHEREx via <a href="https://irsa.ipac.caltech.edu/Missions/spherex.html" target="_blank" rel="noopener">IRSA</a> ·
  names: <a href="https://cds.unistra.fr/cgi-bin/Sesame" target="_blank" rel="noopener">CDS Sesame</a> ·
  NASA Space Apps Challenge 2026 — Planet X and SPHEREx
</footer>
<div class="toast" id="toast" role="status" hidden></div>
<script src="static/app.js" type="module"></script>
</body>
</html>
