# Render Blueprint: one free Docker web service built from the Dockerfile in this repo.
# autoDeploy applies only to a service created from this Blueprint. The live radians.onrender.com was
# created by hand from the public repository URL, so it does NOT redeploy on push: use
# Dashboard -> Manual Deploy -> Deploy latest commit.
services:
  - type: web
    name: radians
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MAX_WORKERS          # 512 MB free instance: fewer parallel reads
        value: "16"
      - key: WARM_ON_START
        value: "1"
